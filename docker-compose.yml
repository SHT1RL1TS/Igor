services:
  db:
    image: postgres:15
    container_name: igor-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - app-network

  db-init:
    image: postgres:15
    env_file:
      - .env
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./postgres/init.sql:/init.sql:ro
    command: ["psql", "-h", "db", "-U", "${DB_USER}", "-d", "${DB_NAME}", "-v", "ON_ERROR_STOP=1", "-f", "/init.sql"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  backend:
    container_name: igor-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DB_HOST: db
      PORT: 8080
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    container_name: igor-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

    ports:
      - "${HTTP_PORT:-80}:80"

networks:
  app-network:
    driver: bridge

volumes:
  pg_data:
