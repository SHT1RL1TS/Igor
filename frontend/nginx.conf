server {
    listen 80;
    server_name igor.com localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    # listen 80;
    server_name igor.com localhost;

    ssl_certificate /etc/nginx/ssl/igor.com+2.pem;
    ssl_certificate_key /etc/nginx/ssl/igor.com+2-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Проксирование интерфейса React (Vite Dev Server)
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Проксирование API на Express
    location /api/ {
        proxy_pass http://backend:5000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
